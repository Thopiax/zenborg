<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0d16; --panel:#12152290; --ink:#e8e6e1; --ink2:#9b98a8; --ink3:#5d5a6b;
          --accent:#93a4f5; --line:#272b3d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.5 "Helvetica Neue", system-ui, sans-serif; overflow:hidden; }
  #globe { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; padding:18px 24px; z-index:5; pointer-events:none; }
  header h1 { font:600 20px Georgia, serif; letter-spacing:.02em; }
  header .sub { color:var(--ink2); font-size:12px; }
  #modes { position:fixed; top:20px; right:24px; z-index:7; display:flex; gap:6px; }
  #modes button { background:#0b0d16cc; border:1px solid var(--line); color:var(--ink2);
                  border-radius:99px; padding:6px 14px; font-size:12px; cursor:pointer; }
  #modes button.on { color:var(--accent); border-color:var(--accent); }
  #panel { position:fixed; top:0; right:0; bottom:0; width:340px; z-index:6;
           background:var(--panel); backdrop-filter: blur(14px); border-left:1px solid var(--line);
           padding:22px; overflow-y:auto; transform:translateX(100%); transition:transform .25s ease; }
  #panel.open { transform:none; }
  #panel h2 { font:600 18px Georgia, serif; color:var(--accent); }
  #panel .meta { color:var(--ink2); font-size:12px; margin:2px 0 16px; }
  #panel .close { position:absolute; top:14px; right:16px; background:none; border:none;
                  color:var(--ink2); font-size:18px; cursor:pointer; }
  .person { padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .person:hover .nm { color:var(--accent); }
  .person .nm { font-size:15px; }
  .person .last { color:var(--ink2); font-size:12px; }
  .person .last b { color:var(--ink); font-weight:500; }
  .refs { display:none; margin:8px 0 4px; padding:10px; background:#0b0d16aa; border:1px solid var(--line);
          border-radius:6px; font-size:12px; }
  .refs.show { display:block; }
  .refs h4 { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:8px 0 3px; }
  .refs h4:first-child { margin-top:0; }
  .refs pre { white-space:pre-wrap; color:var(--ink2); font:11px/1.5 ui-monospace, monospace; max-height:180px; overflow:auto; }
  .refs .loading { color:var(--ink3); font-style:italic; }
  form { margin-top:18px; display:flex; gap:6px; }
  input, select, button { background:#0b0d16; border:1px solid var(--line); color:var(--ink);
          border-radius:6px; padding:7px 9px; font-size:13px; }
  input { flex:1; min-width:0; }
  button { cursor:pointer; color:var(--accent); border-color:var(--accent); }
  #msg { font-size:12px; color:var(--ink2); margin-top:8px; min-height:16px; }
  #unplaced { position:fixed; left:24px; bottom:20px; z-index:5; color:var(--ink3); font-size:12px; max-width:420px; }
  #unplaced b { color:var(--ink2); font-weight:500; }
  #timeline { position:fixed; left:24px; right:24px; bottom:18px; z-index:6; display:none;
              align-items:center; gap:12px; }
  #timeline.show { display:flex; }
  #play { width:38px; height:38px; border-radius:50%; background:#0b0d16cc; border:1px solid var(--accent);
          color:var(--accent); font-size:14px; cursor:pointer; flex:none; }
  #track { flex:1; display:flex; gap:2px; height:26px; align-items:stretch; }
  #track .seg { flex-grow:1; background:var(--line); border-radius:3px; cursor:pointer; min-width:4px;
                transition:background .2s; position:relative; }
  #track .seg.done { background:#4a5578; }
  #track .seg.now { background:var(--accent); }
  #track .seg:hover::after { content:attr(data-tip); position:absolute; bottom:32px; left:50%;
      transform:translateX(-50%); white-space:nowrap; background:#0b0d16ee; border:1px solid var(--line);
      border-radius:6px; padding:4px 8px; font-size:11px; color:var(--ink); }
  #caption { position:fixed; left:50%; transform:translateX(-50%); bottom:64px; z-index:6; display:none;
             text-align:center; background:#0b0d16bb; backdrop-filter:blur(8px); border:1px solid var(--line);
             border-radius:10px; padding:10px 22px; max-width:560px; }
  #caption.show { display:block; }
  #caption .c-name { font:600 17px Georgia, serif; color:var(--accent); }
  #caption .c-dates { color:var(--ink2); font-size:12px; }
  #caption .c-int { color:var(--ink2); font-size:12px; font-style:italic; margin-top:4px; }
  .c-strip { display:flex; height:8px; border-radius:4px; overflow:hidden; gap:1px; margin:8px auto 2px; max-width:320px; }
  .c-strip span { display:block; }
  .c-mix { color:var(--ink3); font-size:11px; }
  .adot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:baseline; }
  #seasons { position:fixed; inset:0; z-index:8; background:#0b0d16f2; backdrop-filter:blur(10px);
             overflow-y:auto; display:none; padding:88px 24px 60px; }
  #seasons.show { display:block; }
  #seasons-inner { max-width:680px; margin:0 auto; }
  .season { padding:20px 0; border-bottom:1px solid var(--line); }
  .season .hdr { color:var(--ink3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  .season .l0 { font:600 19px/1.45 Georgia, serif; color:var(--ink); margin:6px 0 8px; }
  .season .l1 { color:var(--ink2); font-size:14px; line-height:1.65; }
  #seasons h2 { font:600 22px Georgia, serif; color:var(--accent); margin-bottom:4px; }
  #seasons .note { color:var(--ink3); font-size:12px; margin-bottom:18px; }
  .season { cursor:pointer; }
  .season:hover .l0 { color:var(--accent); }
  .season .raw { display:none; margin-top:14px; border-left:2px solid var(--line); padding-left:16px; }
  .season .raw.show { display:block; }
  .entry { margin-bottom:18px; }
  .entry .eh { color:var(--accent); font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
  .entry .eh span { color:var(--ink3); text-transform:none; letter-spacing:0; margin-left:8px; }
  .entry pre { white-space:pre-wrap; font:13px/1.7 Georgia, serif; color:var(--ink2); margin-top:5px; }
  .raw .loading { color:var(--ink3); font-style:italic; font-size:12px; }
  .strip { display:flex; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .strip::-webkit-scrollbar { display:none; }
  .strip img { height:78px; width:78px; object-fit:cover; border-radius:5px; flex:none;
               filter:saturate(.85) brightness(.92); transition:filter .2s, transform .2s; background:var(--line); }
  .season:hover .strip img { filter:saturate(1) brightness(1); }
  .strip .more { flex:none; align-self:center; color:var(--ink3); font-size:11px; padding-left:6px; white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(116px,1fr)); gap:5px; margin:14px 0 4px; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:5px; background:var(--line); }
  .grid img:hover { filter:brightness(1.08); }
  .shot { position:relative; }
  .shot .star { position:absolute; top:5px; right:6px; font-size:13px; line-height:1; cursor:pointer;
                opacity:0; transition:opacity .15s; text-shadow:0 1px 4px #000; user-select:none; }
  .shot:hover .star, .shot .star.on { opacity:1; }
  .shot .star.on { color:#f5d393; }
  .strip img.pick { outline:1.5px solid var(--accent); outline-offset:-1.5px; }
  .strip img.fav { outline:1.5px solid #f5d39366; outline-offset:-1.5px; }
  /* Curated photographs earn scale: a carousel, not a strip. */
  .carousel { display:flex; gap:10px; margin-top:14px; overflow-x:auto; scroll-snap-type:x mandatory;
              scrollbar-width:none; padding-bottom:6px; }
  .carousel::-webkit-scrollbar { display:none; }
  .carousel figure { flex:none; scroll-snap-align:start; margin:0; }
  .carousel img { height:300px; max-width:74vw; width:auto; object-fit:cover; border-radius:9px;
                  background:var(--line); display:block; box-shadow:0 8px 28px #0008; }
  .carousel figcaption { color:var(--ink3); font-size:11px; margin-top:6px; letter-spacing:.04em; }
  .curation { color:var(--ink3); font-size:11px; margin-top:12px; letter-spacing:.05em;
              text-transform:uppercase; }
  .curation b { color:#f5d393; font-weight:500; }
  .curation i { color:var(--accent); font-style:normal; }
  @media (max-width: 700px) { .carousel img { height:220px; } }
</style>
</head>
<body>
<div id="globe"></div>
<header><h1>The Observatory</h1><div class="sub" id="subtitle">people of the garden, live from the vault · click a city</div></header>
<div id="modes">
  <button id="m-people" class="on">People</button>
  <button id="m-journey">Journey</button>
  <button id="m-seasons">Cycles</button>
</div>
<section id="seasons"><div id="seasons-inner"></div></section>
<aside id="panel">
  <button class="close" onclick="panel.classList.remove('open')">✕</button>
  <h2 id="p-city"></h2>
  <div class="meta" id="p-meta"></div>
  <div id="p-people"></div>
  <form id="p-form">
    <input id="p-name" placeholder="add a person…" autocomplete="off">
    <button>plant</button>
  </form>
  <div id="msg"></div>
</aside>
<div id="unplaced"></div>
<div id="caption"></div>
<div id="timeline"><button id="play">▶</button><div id="track"></div></div>

<script src="https://unpkg.com/globe.gl@2.34.4/dist/globe.gl.min.js"
        integrity="sha384-boR1tzK+m2z3pM2fQMq+PoYI0pIQmU+zWj+z3Oy5czzi97itGHXoL/YTj4ypMFbq"
        crossorigin="anonymous"></script>
<script>
const panel = document.getElementById('panel');
let NET = null, currentCity = null;

const world = Globe()(document.getElementById('globe'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .backgroundColor('#0b0d16')
  .atmosphereColor('#93a4f5')
  .atmosphereAltitude(0.18)
  .pointAltitude(0.01)
  .pointColor(() => '#93a4f5')
  .pointRadius(d => 0.4 + Math.sqrt(d.people.length) * 0.22)
  .pointLabel(d => `<b>${d.name}</b> · ${d.people.length}`)
  .labelText('name')
  .labelSize(1.1)
  .labelDotRadius(0)
  .labelColor(() => '#e8e6e1')
  .labelAltitude(0.015)
  .arcColor(() => ['#93a4f5', '#93a4f522'])
  .arcStroke(0.35)
  .arcDashLength(0.5).arcDashGap(0.2).arcDashAnimateTime(4000)
  .onPointClick(openCity)
  .onLabelClick(openCity);

world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 0.4;

async function load() {
  NET = await (await fetch('/api/network')).json();
  world.pointsData(NET.cities).labelsData(NET.cities);
  const home = NET.cities.find(c => c.tag === NET.home);
  if (home) {
    world.arcsData(NET.cities.filter(c => c.tag !== NET.home).map(c => ({
      startLat: home.lat, startLng: home.lng, endLat: c.lat, endLng: c.lng })));
    world.pointOfView({ lat: home.lat, lng: home.lng, altitude: 2.1 }, 0);
  }
  document.getElementById('unplaced').innerHTML = NET.unplaced.length
    ? `<b>unplaced:</b> ${NET.unplaced.map(p => p.name).join(' · ')}`
    : '';
  if (currentCity) openCity(NET.cities.find(c => c.tag === currentCity) ?? null);
}

function fmt(last) {
  return last ? `<b>${last.what}</b> · ${last.day}` : '<i>no moment yet</i>';
}

function openCity(c) {
  if (!c) return;
  currentCity = c.tag;
  world.controls().autoRotate = false;
  document.getElementById('p-city').textContent = c.name;
  document.getElementById('p-meta').textContent =
    `${c.people.length} ${c.people.length === 1 ? 'person' : 'people'} · sorted by last seen`;
  document.getElementById('p-people').innerHTML = c.people.map(p => `
    <div class="person" data-name="${p.name}">
      <div class="nm"><span class="adot" style="background:${p.area?.color ?? '#93a4f5'}" title="${p.area?.name ?? ''}"></span>${p.name}</div>
      <div class="last">${fmt(p.last)}</div>
      <div class="refs" id="refs-${CSS.escape(p.name)}"></div>
    </div>`).join('');
  for (const el of document.querySelectorAll('.person'))
    el.addEventListener('click', () => toggleRefs(el.dataset.name));
  panel.classList.add('open');
  document.getElementById('msg').textContent = '';
}

async function toggleRefs(name) {
  const box = document.getElementById('refs-' + CSS.escape(name));
  if (box.classList.contains('show')) { box.classList.remove('show'); return; }
  box.classList.add('show');
  if (box.dataset.loaded) return;
  box.innerHTML = '<div class="loading">searching the ponds…</div>';
  const r = await (await fetch('/api/references?name=' + encodeURIComponent(name))).json();
  box.dataset.loaded = '1';
  box.innerHTML = r.error
    ? `<div class="loading">${r.error}</div>`
    : r.results.map(p => `<h4>${p.pond}</h4><pre>${p.output.replace(/</g, '&lt;')}</pre>`).join('');
}

// ── Journey mode: a timeline you press play on ──
// Playback is time-proportional: the whole journey targets TOTAL_MS of wall
// clock, so every day of life costs the same fraction of a second on screen.
let JOURNEY = null, MODE = 'people', IDX = -1, PLAYING = false, timer = null;
const TOTAL_MS = 75000, MIN_DWELL = 1400;
let msPerDay = 200;
const stopDays = s => Math.max(1, (new Date(s.end ?? s.start) - new Date(s.start)) / 86400000 + 1);
const dwell = s => Math.max(MIN_DWELL, stopDays(s) * msPerDay);

async function showJourney() {
  MODE = 'journey';
  setModeButtons();
  panel.classList.remove('open');
  world.controls().autoRotate = false;
  if (!JOURNEY) JOURNEY = await (await fetch('/api/cycles')).json();
  const totalDays = JOURNEY.stops.reduce((s, x) => s + stopDays(x), 0);
  msPerDay = TOTAL_MS / totalDays;
  buildTrack();
  document.getElementById('timeline').classList.add('show');
  document.getElementById('subtitle').textContent =
    `${JOURNEY.stops.length} cycles over ${Math.round(totalDays)} days · playback: 1s ≈ ${(1000 / msPerDay).toFixed(1)} days`;
  document.getElementById('unplaced').innerHTML = '';
  world.labelsData([]).pointLabel(d => `<b>${d.place}</b>`);
  world.onPointClick(() => {}).onLabelClick(() => {});
  goTo(IDX === -1 ? 0 : IDX, false);
}

function buildTrack() {
  const track = document.getElementById('track');
  const days = s => Math.max(2, (new Date(s.end ?? s.start) - new Date(s.start)) / 86400000 + 1);
  track.innerHTML = JOURNEY.stops.map((s, i) =>
    `<div class="seg" style="flex-grow:${days(s)}" data-i="${i}" data-tip="${s.cycle} · ${s.place}"></div>`).join('');
  for (const seg of track.children)
    seg.addEventListener('click', () => { pause(); goTo(Number(seg.dataset.i), true); });
}

function goTo(i, fly) {
  IDX = i;
  const s = JOURNEY.stops[i];
  const visited = JOURNEY.stops.slice(0, i + 1)
    .filter((v, idx, arr) => arr.findIndex(x => x.place === v.place) === idx);
  world.pointsData(visited)
    .pointAltitude(0.008).pointRadius(0.5)
    .ringsData([s]).ringLat('lat').ringLng('lng')
    .ringMaxRadius(3.4).ringPropagationSpeed(1.6).ringRepeatPeriod(900)
    .ringColor(d => {
      // the season's ring wears its dominant area's color — color names the area
      const hex = d.areas?.[0]?.color ?? '#93a4f5';
      const [r, g, b] = [1, 3, 5].map(o => parseInt(hex.slice(o, o + 2), 16));
      return t => `rgba(${r},${g},${b},${1 - t})`;
    })
    .arcsData(JOURNEY.arcs.filter(a => a.order <= i))
    .arcDashLength(0.6).arcDashGap(0.25)
    .arcDashAnimateTime(d => d.order === i ? 2200 : 0);
  world.pointOfView({ lat: s.lat, lng: s.lng, altitude: 1.7 }, fly ? 1100 : 0);
  const cap = document.getElementById('caption');
  cap.classList.add('show');
  const mix = (s.areas ?? []).slice(0, 6);
  cap.innerHTML = `<div class="c-name">${s.n} · ${s.cycle}</div>
    <div class="c-dates">${s.place} — ${s.start} → ${s.end ?? 'open'}</div>
    ${s.intention || s.l0 ? `<div class="c-int">${s.intention ?? s.l0}</div>` : ''}
    ${mix.length ? `<div class="c-strip">${mix.map(a =>
        `<span style="flex-grow:${a.count};background:${a.color}" title="${a.name}: ${a.count}"></span>`).join('')}</div>
      <div class="c-mix">${s.momentCount} moments · ${mix.map(a => `${a.emoji} ${a.count}`).join(' · ')}</div>` : ''}`;
  const segs = document.querySelectorAll('#track .seg');
  segs.forEach((seg, idx) => {
    seg.classList.toggle('done', idx < i);
    seg.classList.toggle('now', idx === i);
  });
}

function play() {
  PLAYING = true;
  document.getElementById('play').textContent = '⏸';
  const advance = () => {
    if (IDX >= JOURNEY.stops.length - 1) return pause();
    goTo(IDX + 1, true);
    timer = setTimeout(advance, dwell(JOURNEY.stops[IDX]));
  };
  if (IDX >= JOURNEY.stops.length - 1) IDX = -1;
  timer = setTimeout(advance, IDX === -1 ? 200 : dwell(JOURNEY.stops[IDX]) / 2);
}
function pause() {
  PLAYING = false;
  clearTimeout(timer);
  document.getElementById('play').textContent = '▶';
}
document.getElementById('play').addEventListener('click', () => (PLAYING ? pause() : play()));

function showPeople() {
  MODE = 'people';
  setModeButtons();
  pause();
  panel.classList.remove('open');
  document.getElementById('p-form').style.display = '';
  document.getElementById('timeline').classList.remove('show');
  document.getElementById('caption').classList.remove('show');
  world.pointsData([]).arcsData([]).labelsData([]).ringsData([]);
  world.pointAltitude(0.01)
    .pointRadius(d => 0.4 + Math.sqrt(d.people.length) * 0.22)
    .pointLabel(d => `<b>${d.name}</b> · ${d.people.length}`)
    .labelText('name')
    .arcDashLength(0.5).arcDashGap(0.2).arcDashAnimateTime(4000);
  world.onPointClick(openCity).onLabelClick(openCity);
  document.getElementById('subtitle').textContent = 'people of the garden, live from the vault · click a city';
  load();
}
function setModeButtons() {
  document.getElementById('m-people').classList.toggle('on', MODE === 'people');
  document.getElementById('m-journey').classList.toggle('on', MODE === 'journey');
}
// ── Seasons: the reflections, read here and nowhere else ──
async function showSeasons() {
  pause();
  panel.classList.remove('open');
  const box = document.getElementById('seasons');
  const inner = document.getElementById('seasons-inner');
  box.classList.add('show');
  document.getElementById('m-seasons').classList.add('on');
  inner.innerHTML = '<div class="note">reading the vault…</div>';
  const r = await (await fetch('/api/reflections')).json();
  inner.innerHTML = `<h2>Cycles</h2>
    <div class="note">${r.count} reflections · newest first · L0 lede, then the tldr · press Escape to close</div>` +
    r.cycles.map(c => `
      <div class="season" data-start="${c.start}">
        <div class="hdr">${c.start} → ${c.end ?? 'open'} · ${c.name}</div>
        <div class="l0">${c.l0}</div>
        ${c.l1 ? `<div class="l1">${c.l1.replace(/\n/g, '<br>')}</div>` : ''}
        <div class="strip"></div>
        <div class="raw"></div>
      </div>`).join('');
  for (const el of inner.querySelectorAll('.season')) {
    el.addEventListener('click', () => toggleRaw(el));
    loadStrip(el);
  }
}

// A cycle's photographs: a few spread across its window, as the card's own
// evidence that it happened.
async function loadStrip(el) {
  const strip = el.querySelector('.strip');
  if (!strip) return;
  const r = await (await fetch('/api/photos?start=' + encodeURIComponent(el.dataset.start) + '&limit=24')).json();
  if (r.error || !r.photos?.length) { strip.remove(); return; }

  // Curated cycles get the carousel — and only the curated photographs.
  if (r.mode !== 'spread') {
    strip.className = 'carousel';
    strip.innerHTML = r.hero.map(p => `
      <figure>
        <img loading="lazy" src="/thumb/${p.uuid}" alt="">
        <figcaption>${p.day}${p.highlighted ? ' · highlighted' : ''}</figcaption>
      </figure>`).join('');
    el.querySelector('.curation')?.remove();
    const note = document.createElement('div');
    note.className = 'curation';
    note.innerHTML = r.mode === 'highlights'
      ? `<i>${r.highlighted} highlighted</i> of ${r.total} photographs`
      : `<b>${r.favorites} favourite${r.favorites === 1 ? '' : 's'}</b> of ${r.total} photographs`;
    strip.after(note);
    return;
  }

  strip.className = 'strip';
  strip.innerHTML = r.photos.slice(0, 8).map(p =>
    `<img loading="lazy" src="/thumb/${p.uuid}" alt="" title="${p.day}">`).join('') +
    (r.total > 8 ? `<span class="more">+${r.total - 8}</span>` : '');
}

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

async function toggleRaw(el) {
  const box = el.querySelector('.raw');
  if (box.classList.contains('show')) { box.classList.remove('show'); return; }
  box.classList.add('show');
  if (box.dataset.loaded) return;
  box.innerHTML = '<div class="loading">opening the days…</div>';
  const r = await (await fetch('/api/entries?start=' + encodeURIComponent(el.dataset.start))).json();
  box.dataset.loaded = '1';
  const photos = await (await fetch('/api/photos?start=' + encodeURIComponent(el.dataset.start) + '&limit=48')).json();
  const grid = photos.photos?.length
    ? `<div class="loading">${photos.total} photograph${photos.total === 1 ? '' : 's'}${
         photos.favorites ? ` · ${photos.favorites} favourite${photos.favorites === 1 ? '' : 's'}` : ''
       } · click ★ to highlight</div>
       <div class="grid">${photos.photos.map(p =>
         `<div class="shot">
            <img loading="lazy" src="/thumb/${p.uuid}" alt="" title="${p.day}">
            <span class="star ${p.highlighted ? 'on' : ''}" data-uuid="${p.uuid}">${p.highlighted ? '★' : '☆'}</span>
          </div>`).join('')}</div>`
    : '';
  const entries = r.error
    ? `<div class="loading">${r.error}</div>`
    : r.entries.length
      ? `<div class="loading">${r.entries.length} ${r.entries.length === 1 ? 'entry' : 'entries'} — the raw material</div>` +
        r.entries.map(e => `
          <div class="entry">
            <div class="eh">${e.weekday} ${e.day}<span>${e.source}</span></div>
            <pre>${esc(e.text)}</pre>
          </div>`).join('')
      : '<div class="loading">no entries in this window</div>';
  box.innerHTML = grid + entries;
  // Stars toggle without collapsing the card, and refresh the strip so the
  // pick shows up where it counts.
  for (const star of box.querySelectorAll('.star')) {
    star.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const r = await (await fetch('/api/highlight', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ cycle: el.dataset.start, uuid: star.dataset.uuid }),
      })).json();
      if (r.error) return;
      star.classList.toggle('on', r.highlighted);
      star.textContent = r.highlighted ? '★' : '☆';
      const strip = el.querySelector('.strip');
      if (strip) loadStrip(el);
    });
  }
}
function hideSeasons() {
  document.getElementById('seasons').classList.remove('show');
  document.getElementById('m-seasons').classList.remove('on');
}
document.getElementById('m-seasons').addEventListener('click', () =>
  document.getElementById('seasons').classList.contains('show') ? hideSeasons() : showSeasons());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideSeasons(); });

document.getElementById('m-people').addEventListener('click', () => { hideSeasons(); showPeople(); });
document.getElementById('m-journey').addEventListener('click', () => { hideSeasons(); showJourney(); });

document.getElementById('p-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('p-name').value;
  const res = await fetch('/api/person', { method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name, city: currentCity }) });
  const out = await res.json();
  document.getElementById('msg').textContent = out.error ? `✗ ${out.error}` : `✓ ${out.created} planted in ${document.getElementById('p-city').textContent}`;
  if (!out.error) { document.getElementById('p-name').value = ''; load(); }
});

load();
</script>
</body>

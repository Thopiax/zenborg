[package]
name = "zenborg-daemon"
version = "0.1.0"
edition = "2021"
description = "Headless sidecar: desktop observer + scheduler. No Tauri."

[[bin]]
name = "zenborg-daemon"
path = "src/main.rs"

[dependencies]
observer-core = { path = "../observer-core" }
chrono = "0.4"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
notify = "6.1"
dirs = "5.0"
anyhow = "1.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
x-win = "5.7.0"
user-idle = "0.6"

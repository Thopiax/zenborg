[workspace]
members = [".", "crates/observer-core", "crates/kairos-daemon"]

[package]
name = "app"
version = "0.3.13"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
notify = "6.1"
dirs = "5.0"
anyhow = "1.0"
tempfile = "3.10"
tauri = { version = "2.9.1", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }

# The desktop observer. Pure logic in observer-core; sensors + Tauri wiring here.
observer-core = { path = "crates/observer-core" }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[features]
e2e-testing = ["tauri-plugin-playwright"]


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
x-win = "5.7.0"
user-idle = "0.6"
media-remote = { version = "0.5.2", default-features = false }

# Dev profile tuned for disk usage. Full debuginfo + incremental compilation
# push target/debug into double-digit GB territory during normal tauri:dev
# work. Trade:
#  - `debug = "line-tables-only"` keeps backtrace file:line, drops the rest.
#  - `incremental = false` drops the unbounded snapshot cache.
# Hot rebuilds slightly slower; cold rebuild unchanged (deps dominate).
[profile.dev]
debug = "line-tables-only"
incremental = false
